<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Booking — Alvira Homestay</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="booking.css"></head><body><main class="booking-wrap"><div class="booking-card" style="max-width:650px;margin:auto"><span class="eyebrow">ALVIRA HOMESTAY</span><h1 style="font-family:var(--font-serif);color:var(--text-dark);margin:12px 0">Cek permintaan booking</h1><p class="muted">Masukkan kode permintaan yang didapat setelah mengirim formulir booking.</p><label>Kode booking<input id="code" placeholder="Contoh: ALV-12345678"></label><button class="btn btn-primary" id="search">Cari booking</button><div id="result" style="margin-top:20px"></div><p style="margin-top:22px"><a class="text-link" href="booking.html">← Kembali ke booking</a></p></div></main><script>document.getElementById('search').onclick=()=>{const code=document.getElementById('code').value.trim().toUpperCase();const list=JSON.parse(localStorage.getItem('alvira_demo_bookings')||'[]');const b=list.find(x=>x.code.toUpperCase()===code);document.getElementById('result').innerHTML=b?`<div class="notice"><div><strong>${b.code}</strong><p>${b.name}</p><p>${b.checkin} — ${b.checkout} (${b.nights} malam)</p><p>${b.guests} tamu · ${b.status}</p><p>Total estimasi: Rp${b.total.toLocaleString('id-ID')}</p><small>Data ini tersimpan di browser/perangkat yang digunakan saat membuat permintaan.</small></div></div>`:'<p class="error">Kode tidak ditemukan pada browser ini. Hubungi pengelola melalui WhatsApp untuk status terbaru.</p>'}</script></body></html>
